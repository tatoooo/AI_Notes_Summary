<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>AI 會議紀錄助手</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            background: #f3f4f6;
        }
        .wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            background: #ffffff;
            padding: 32px 40px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.12);
            max-width: 760px;
            width: 100%;
        }
        h1 {
            margin: 0 0 4px;
            font-size: 28px;
        }
        .subtitle {
            margin: 0 0 24px;
            font-size: 14px;
            color: #6b7280;
        }
        .upload-box {
            border: 2px dashed #d1d5db;
            border-radius: 14px;
            padding: 20px;
            text-align: center;
            background: #f9fafb;
            margin-bottom: 20px;
        }
        .upload-box p {
            margin: 0 0 8px;
            font-size: 14px;
            color: #4b5563;
        }
        input[type="file"] {
            margin: 8px auto;
        }
        button {
            margin-top: 8px;
            padding: 10px 22px;
            border-radius: 999px;
            border: none;
            font-size: 14px;
            cursor: pointer;
            background: #4f46e5;
            color: #ffffff;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.35);
        }
        button:hover {
            background: #4338ca;
        }
        .hint {
            margin-top: 8px;
            font-size: 12px;
            color: #9ca3af;
        }
        .section-title {
            margin: 24px 0 8px;
            font-size: 16px;
        }
        pre {
            background: #111827;
            color: #e5e7eb;
            padding: 12px 14px;
            border-radius: 10px;
            max-height: 260px;
            overflow: auto;
            font-size: 13px;
            white-space: pre-wrap;
        }
        .empty {
            font-size: 13px;
            color: #9ca3af;
        }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="card">
        <h1>AI 會議紀錄助手</h1>
        <p class="subtitle">
            上傳一段會議錄音，後端會幫你轉文字並整理內容。
            （目前先測試上傳功能，之後會接上 Whisper + GPT）
        </p>

        <form action="/upload-meeting" method="post" enctype="multipart/form-data">
            <div class="upload-box">
                <p>拖曳或點擊選擇一個音訊檔案</p>
                <input type="file" name="file" accept="audio/*" required>
                <br>
                <button type="submit">上傳並分析</button>
                <div class="hint">支援常見格式：.mp3、.wav 等</div>
            </div>
        </form>

        {% if result %}
            <h2 class="section-title">後端回傳結果（目前是測試資訊）</h2>
            <pre>{{ result }}</pre>
        {% else %}
            <p class="empty">尚未有任何分析結果，請先選擇檔案上傳。</p>
        {% endif %}
    </div>
</div>
</body>
</html>
